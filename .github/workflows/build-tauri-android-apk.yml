name: Build FCT Automobile Android APK (Tauri v2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/build-tauri-android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Environment (Pre-installed GitHub SDK)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "26.*" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "27.*" 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | head -n 1)
          fi
          echo "Selected NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Ensure Global Node Symlinks and Gradle Configuration
        run: |
          NODE_PATH=$(which node)
          echo "Node.js detected at: $NODE_PATH"
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node
          sudo ln -sf "$NODE_PATH" /usr/bin/node
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          org.gradle.logging.level=lifecycle
          org.gradle.logging.stacktrace=all
          org.gradle.console=plain
          EOF

      - name: Install Frontend Dependencies & Global Tauri CLI
        run: |
          npm install
          npm install -g @tauri-apps/cli@2.12.2
          # Symlinks de securite pour garantir que Gradle trouve toujours node_modules a tous les niveaux d'arborescence
          ln -sf "$(pwd)/node_modules" src-tauri/node_modules
          mkdir -p src-tauri/gen/android/app
          ln -sf "$(pwd)/node_modules" src-tauri/gen/node_modules
          ln -sf "$(pwd)/node_modules" src-tauri/gen/android/node_modules
          ln -sf "$(pwd)/node_modules" src-tauri/gen/android/app/node_modules

      - name: Build Frontend Web Assets
        run: npm run build

      - name: Initialize Tauri Android Target
        run: |
          npx tauri android init --ci --skip-targets-install
          echo "=== FICHIERS BUILDTASK DETECTES DANS GEN/ANDROID ==="
          find src-tauri/gen/android -name "*BuildTask*.kt" -exec echo "--- {} ---" \; -exec cat {} \; || true

      - name: Build Android Debug APK (Directly Installable on Phone)
        run: |
          npx tauri android build -v --apk --debug --target aarch64 --ignore-version-mismatches

      - name: Dump Detailed Gradle Failure Logs
        if: failure()
        run: |
          echo "=== RECHERCHE DES FICHIERS DE LOGS & RAPPORTS GRADLE ==="
          find src-tauri/gen/android -name "*.log" -o -name "*.txt" -o -name "*.html" 2>/dev/null | head -n 30 | while read f; do
            echo "--- $f ---"
            grep -i -C 3 -m 20 "error\|exception\|failed" "$f" || head -n 30 "$f" || true
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fct-automobile-debug-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/target/**/*.apk
          retention-days: 14
