name: Build FCT Automobile Android APK (Tauri v2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/build-tauri-android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Environment (Pre-installed GitHub SDK)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "28.*" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "27.*" 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)
          fi
          echo "Selected NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Ensure Global Node Symlinks and Gradle Configuration
        run: |
          NODE_PATH=$(which node)
          echo "Node.js detected at: $NODE_PATH"
          sudo ln -sf "$NODE_PATH" /usr/local/bin/node
          sudo ln -sf "$NODE_PATH" /usr/bin/node
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          org.gradle.logging.level=info
          org.gradle.logging.stacktrace=all
          org.gradle.console=plain
          EOF

      - name: Install Frontend Dependencies & Global Tauri CLI
        run: |
          npm install
          npm install -g @tauri-apps/cli@2.12.2

      - name: Build Frontend Web Assets
        run: npm run build

      - name: Initialize Tauri Android Target
        run: |
          rm -rf src-tauri/gen
          npx tauri android init --ci --skip-targets-install
          # Assurer les droits d'execution sur le wrapper Gradle
          chmod +x src-tauri/gen/android/gradlew || true
          # Symlinks de securite hierarchiques pour node_modules
          ln -sf "$(pwd)/node_modules" src-tauri/node_modules
          ln -sf "$(pwd)/node_modules" src-tauri/gen/node_modules
          ln -sf "$(pwd)/node_modules" src-tauri/gen/android/node_modules
          ln -sf "$(pwd)/node_modules" src-tauri/gen/android/app/node_modules
          # Symlinks universels pour le binaire et script tauri
          CLI_REAL="$(pwd)/node_modules/@tauri-apps/cli/tauri.js"
          chmod +x "$CLI_REAL"
          ln -sf "$CLI_REAL" "$(pwd)/tauri"
          ln -sf "$CLI_REAL" "$(pwd)/tauri.js"
          ln -sf "$CLI_REAL" "$(pwd)/src-tauri/tauri"
          ln -sf "$CLI_REAL" "$(pwd)/src-tauri/tauri.js"
          ln -sf "$CLI_REAL" "$(pwd)/src-tauri/gen/tauri"
          ln -sf "$CLI_REAL" "$(pwd)/src-tauri/gen/tauri.js"
          ln -sf "$CLI_REAL" "$(pwd)/src-tauri/gen/android/tauri"
          ln -sf "$CLI_REAL" "$(pwd)/src-tauri/gen/android/tauri.js"
          ln -sf "$CLI_REAL" "$(pwd)/src-tauri/gen/android/app/tauri"
          ln -sf "$CLI_REAL" "$(pwd)/src-tauri/gen/android/app/tauri.js"
          # Scan exhaustif et patch des scripts Kotlin de build
          python3 -c "
          import os, re
          cli_path = os.path.abspath('node_modules/@tauri-apps/cli/tauri.js')
          print('Chemin absolu du CLI:', cli_path)
          assert os.path.exists(cli_path)
          found = 0
          for root, dirs, files in os.walk('src-tauri/gen/android'):
              for f in files:
                  if f.endswith('.kt'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fp:
                          c = fp.read()
                      if 'tauri' in c.lower() or 'commandline' in c.lower() or 'buildtask' in f.lower():
                          found += 1
                          print('=== SCAN KOTLIN ' + p + ' ===')
                          print(c)
                          c_mod = re.sub(r'\"[^\"]*tauri(\.js)?\"', f'\"{cli_path}\"', c)
                          if c_mod != c:
                              print('--> PATCH APPLIQUE SUR ' + p)
                              with open(p, 'w', encoding='utf-8') as fp:
                                  fp.write(c_mod)
          print(f'Total fichiers Kotlin inspectes avec mot-cle : {found}')
          "

      - name: Build Android Debug APK (Directly Installable on Phone)
        run: |
          npx tauri android build -v --apk --debug --target aarch64 --ignore-version-mismatches 2>&1 | tee build_tauri.log

      - name: Locate Generated Packages
        run: |
          echo "=== FICHIERS PACKAGES PRODUITS DANS BUILD/OUTPUTS ==="
          find src-tauri/gen/android/app/build/outputs -type f -exec ls -lh {} + 2>/dev/null || true
          echo "=== RECHERCHE GLOBALE DE TOUS LES APK ET AAB ==="
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -lh {} + 2>/dev/null || true

      - name: Dump Detailed Gradle Failure Logs
        if: failure()
        run: |
          echo "=== EXTRAIT D'ERREUR DU LOG COMPLET ==="
          grep -i -C 5 "error:\|exception\|failed\|cannot find" build_tauri.log | head -n 120 || true
          echo "=== 150 DERNIERES LIGNES DU LOG ==="
          tail -n 150 build_tauri.log || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fct-automobile-debug-apk
          path: |
            src-tauri/gen/android/app/build/outputs/**
            **/*.apk
            **/*.aab
          if-no-files-found: warn
          retention-days: 14
