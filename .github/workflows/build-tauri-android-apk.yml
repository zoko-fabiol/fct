name: Build FCT Automobile Android APK (Tauri v2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/build-tauri-android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android Build Tools & NDK
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend Web Assets
        run: npm run build

      - name: Initialize Tauri Android Target
        run: |
          node ./node_modules/@tauri-apps/cli/tauri.js android init --ci --skip-targets-install

      - name: Build Android APK (Tauri Release)
        run: |
          node ./node_modules/@tauri-apps/cli/tauri.js android build --apk --target aarch64

      - name: Locate and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fct-automobile-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14
