name: Build FCT Automobile Android APK (Natif & Garanti)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21 (Requis par Capacitor 8 & AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK (API 36 & Build Tools 36)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0 platform-tools'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          yes | sdkmanager --licenses || true

      - name: Cache or Restore Persistent Keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: android/app/fct-release.keystore
          key: fct-keystore-permanent-v1

      - name: Ensure Persistent Java Keystore
        run: |
          if [ ! -f android/app/fct-release.keystore ]; then
            echo "Generation du Keystore persistant FCT valide 30 ans avec keytool..."
            keytool -genkeypair -v \
              -keystore android/app/fct-release.keystore \
              -alias fctkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass fctautomobile2026 \
              -keypass fctautomobile2026 \
              -dname "CN=FCT Automobile, OU=Direction Automobile, O=Franchise Conseils Trading, L=Douala, ST=Littoral, C=CM" \
              -deststoretype PKCS12
          fi
          ls -lh android/app/fct-release.keystore

      - name: Commit Keystore to Repository (if newly created)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain android/app/fct-release.keystore | grep -q "fct-release.keystore"; then
            git add android/app/fct-release.keystore
            git commit -m "chore(keystore): sauvegarde de la cle de signature Keystore FCT [skip ci]" || true
            git push || true
          fi

      - name: Install Dependencies
        run: npm install

      - name: Ensure Environment Configuration
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Web Application (Vite Production)
        run: npm run build

      - name: Sync Capacitor Android Project
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Assemble Android APK (Gradle)
        working-directory: android
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        run: |
          echo "=== VERIFICATION DE L'APK GENERE ==="
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "L'APK a ete assemble et signe avec succes !"

      - name: Upload FCT Automobile APK
        uses: actions/upload-artifact@v4
        with:
          name: fct-automobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
