name: Build FCT Automobile Android APK (Natif & Infaillible)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Android SDK Environment & Licences
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Assemble Android APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify Generated APK
        run: |
          echo "=== VERIFICATION DE L'APK GENERE ==="
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "L'APK a ete assemble avec succes !"

      - name: Upload FCT Automobile APK
        uses: actions/upload-artifact@v4
        with:
          name: fct-automobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
