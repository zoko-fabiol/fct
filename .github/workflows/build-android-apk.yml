name: Build FCT Automobile Android APK (Natif & Garanti)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21 (Requis par Capacitor 8 & AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK (API 36 & Build Tools 36)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0 platform-tools'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application (Vite Production)
        run: npm run build

      - name: Sync Capacitor Android Project
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Assemble Android APK (Gradle)
        working-directory: android
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        run: |
          echo "=== VERIFICATION DE L'APK GENERE ==="
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "L'APK a ete assemble avec succes !"

      - name: Upload FCT Automobile APK
        uses: actions/upload-artifact@v4
        with:
          name: fct-automobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
